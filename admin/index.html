<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Painel Admin — Newmed</title>
<link rel="icon" type="image/png" href="../img/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<style>
  body { background: var(--bg-alt); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .admin-card { background: var(--white); border-radius: var(--radius-lg); padding: 40px; max-width: 460px; width: 100%; box-shadow: var(--shadow-lg); }
  .admin-card .brand-logo { height: 40px; margin-bottom: 24px; }
  .admin-card h1 { font-size: 1.3rem; margin-bottom: 6px; }
  .admin-card > div > p { color: var(--ink-500); margin-bottom: 22px; font-size: .92rem; }
  .admin-msg { margin-top: 16px; padding: 12px 16px; border-radius: var(--radius-sm); font-size: .88rem; }
  .admin-msg.ok { background: #DCFCE7; color: #166534; }
  .admin-msg.err { background: #FEE2E2; color: #991B1B; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<div class="admin-card">
  <img src="../img/logo-newmed.png" alt="Newmed" class="brand-logo">

  <div id="login-view">
    <h1>Painel Admin</h1>
    <p>Digite a senha de administrador para continuar.</p>
    <div class="field">
      <label for="senha">Senha</label>
      <input type="password" id="senha" autocomplete="current-password">
    </div>
    <button type="button" class="btn btn-primary btn-block" id="btn-entrar">Entrar</button>
    <div class="admin-msg err" id="login-msg" hidden></div>
  </div>

  <div id="form-view" hidden>
    <h1>Adicionar produto</h1>
    <p>Preencha os dados abaixo — eles aparecem no catálogo do site.</p>
    <form id="produto-form">
      <div class="field">
        <label for="nome">Nome do produto</label>
        <input type="text" id="nome" required>
      </div>
      <div class="field">
        <label for="categoria">Categoria</label>
        <select id="categoria" required>
          <option value="">Selecione…</option>
        </select>
      </div>
      <div class="field">
        <label for="foto">Foto</label>
        <input type="file" id="foto" accept="image/*">
      </div>
      <div class="field">
        <label for="descricao">Descrição (opcional)</label>
        <textarea id="descricao" rows="4"></textarea>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="btn-salvar">Salvar produto</button>
    </form>
    <div class="admin-msg" id="form-msg" hidden></div>
  </div>
</div>

<script src="../js/script.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const FN_URL = "/.netlify/functions/add-product";
  let senhaAtual = "";

  const loginView = document.getElementById("login-view");
  const formView = document.getElementById("form-view");
  const loginMsg = document.getElementById("login-msg");
  const formMsg = document.getElementById("form-msg");
  const categoriaSelect = document.getElementById("categoria");

  Object.entries(NEWMED.categorias).forEach(([id, label]) => {
    const opt = document.createElement("option");
    opt.value = id;
    opt.textContent = label;
    categoriaSelect.appendChild(opt);
  });

  try {
    const saved = sessionStorage.getItem("newmed-admin-pw");
    if (saved) {
      senhaAtual = saved;
      loginView.hidden = true;
      formView.hidden = false;
    }
  } catch (e) {}

  function entrar() {
    const v = document.getElementById("senha").value.trim();
    if (!v) return;
    senhaAtual = v;
    try { sessionStorage.setItem("newmed-admin-pw", v); } catch (e) {}
    loginMsg.hidden = true;
    loginView.hidden = true;
    formView.hidden = false;
  }
  document.getElementById("btn-entrar").addEventListener("click", entrar);
  document.getElementById("senha").addEventListener("keydown", (e) => {
    if (e.key === "Enter") entrar();
  });

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result).split(",")[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  document.getElementById("produto-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("btn-salvar");
    formMsg.hidden = true;
    btn.disabled = true;
    btn.textContent = "Salvando…";

    try {
      const nome = document.getElementById("nome").value.trim();
      const categoria = categoriaSelect.value;
      const descricao = document.getElementById("descricao").value.trim();
      const file = document.getElementById("foto").files[0];

      let fotoBase64 = "";
      let fotoNome = "";
      if (file) {
        fotoBase64 = await fileToBase64(file);
        fotoNome = file.name;
      }

      const res = await fetch(FN_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: senhaAtual, nome, categoria, descricao, fotoBase64, fotoNome }),
      });
      const data = await res.json().catch(() => ({}));

      if (res.status === 401) {
        try { sessionStorage.removeItem("newmed-admin-pw"); } catch (e2) {}
        formView.hidden = true;
        loginView.hidden = false;
        loginMsg.textContent = "Senha incorreta. Tente novamente.";
        loginMsg.hidden = false;
        return;
      }
      if (!res.ok) throw new Error(data.error || "Erro ao salvar.");

      formMsg.className = "admin-msg ok";
      formMsg.textContent = "Produto salvo! Ele aparece no site em 1-2 minutos.";
      formMsg.hidden = false;
      document.getElementById("produto-form").reset();
    } catch (err) {
      formMsg.className = "admin-msg err";
      formMsg.textContent = err.message || "Erro ao salvar. Tente novamente.";
      formMsg.hidden = false;
    } finally {
      btn.disabled = false;
      btn.textContent = "Salvar produto";
    }
  });
});
</script>
</body>
</html>
